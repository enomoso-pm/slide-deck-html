<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&family=Noto+Serif+JP:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #2a2a2a;
    min-height: 100vh;
    padding: 20px 0;
    font-family: 'Noto Sans JP', sans-serif;
  }
  .slides-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 30px;
  }
  .slide-meta {
    width: 1280px;
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    color: #aaa;
    font-size: 13px;
    font-family: 'Inter', sans-serif;
  }
  .slide {
    width: 1280px;
    height: 720px;
    background: white;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    position: relative;
    overflow: hidden;
    font-family: 'Noto Sans JP', sans-serif;
    color: #1A2538;
    border: 1px solid #D0D0D0;
  }

  /* ========== Cover Slide ========== */
  .slide-cover {
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: 0;
  }
  .cover-top {
    flex: 1;
    padding: 100px 70px 40px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    background: #fff;
    position: relative;
  }
  .cover-top::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 8px;
    height: 100%;
    background: #2563EB;
  }
  .cover-top .category {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    letter-spacing: 0.3em;
    color: #2563EB;
    font-weight: 600;
    margin-bottom: 20px;
    text-transform: uppercase;
  }
  .cover-top h1 {
    font-family: 'Noto Serif JP', serif;
    font-size: 46px;
    font-weight: 600;
    color: #0F172A;
    letter-spacing: 0.02em;
    line-height: 1.4;
    margin-bottom: 24px;
  }
  .cover-top .subtitle {
    font-size: 16px;
    color: #555;
    line-height: 1.9;
    max-width: 820px;
  }
  .cover-bottom {
    padding: 28px 70px;
    background: #F5F5F4;
    border-top: 1px solid #D0D0D0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: #555;
  }
  .cover-bottom .date { font-weight: 500; letter-spacing: 0.08em; }
  .cover-bottom .org { font-weight: 500; letter-spacing: 0.05em; }

  /* ========== Standard Page ========== */
  .slide-page {
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: 0;
  }
  .page-header {
    padding: 22px 40px 14px;
    border-bottom: 1px solid #D0D0D0;
    background: #fff;
  }
  .page-header .meta-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .page-header .item-id {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: #2563EB;
    font-weight: 600;
  }
  .page-header .priority {
    display: inline-block;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    padding: 4px 14px;
    border: 1px solid #2563EB;
    color: #2563EB;
    letter-spacing: 0.1em;
    font-weight: 500;
  }
  .page-header .action-title {
    font-family: 'Noto Serif JP', serif;
    font-size: 22px;
    font-weight: 600;
    color: #0F172A;
    letter-spacing: 0.01em;
    line-height: 1.4;
  }
  /* 強調は <span class="em"> でも素の <em> でも効くようにする。
     指示どおり <em> と書いたのに青にならず斜体になる事故を防ぐ。
     日本語の合成イタリックは見苦しいので font-style は打ち消す。 */
  .page-header .action-title .em,
  .page-header .action-title em { color: #2563EB; font-style: normal; }
  .page-header .lead-in {
    margin-top: 6px;
    font-size: 12px;
    color: #555;
    line-height: 1.6;
    letter-spacing: 0.02em;
  }

  /* ========== Body Section ========== */
  .page-body {
    flex: 1;
    padding: 16px 40px 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .section-label {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    letter-spacing: 0.25em;
    color: #2563EB;
    font-weight: 600;
    margin-bottom: 10px;
    text-transform: uppercase;
  }
  .section-title {
    font-family: 'Noto Serif JP', serif;
    font-size: 17px;
    font-weight: 600;
    color: #0F172A;
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 2px solid #2563EB;
  }

  /* ========== Content Blocks ========== */
  .content-block { margin-bottom: 14px; }
  .block-heading {
    font-weight: 600;
    font-size: 13px;
    color: #2563EB;
    margin-bottom: 6px;
    letter-spacing: 0.02em;
  }
  .block-body {
    font-size: 12px;
    line-height: 1.85;
    color: #1A2538;
    letter-spacing: 0.01em;
  }
  .block-body ul { list-style: none; padding-left: 0; }
  .block-body li {
    padding-left: 16px;
    position: relative;
    margin-bottom: 2px;
  }
  .block-body li::before {
    content: '―';
    position: absolute;
    left: 0;
    color: #2563EB;
    font-weight: 400;
  }

  /* ========== Inline Accents ========== */
  .accent-warn { color: #D97706; font-weight: 500; }
  .accent-em { color: #2563EB; font-weight: 500; }

  /* ========== Layout ========== */
  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
    flex: 1;
  }

  /* ========== Takeaway / Highlight Box ========== */
  .takeaway {
    margin-top: 12px;
    padding: 14px 20px;
    background: #EFF6FF;
    border-left: 4px solid #2563EB;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .takeaway .label {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: #2563EB;
    font-weight: 700;
    white-space: nowrap;
  }
  .takeaway .text {
    font-size: 13px;
    color: #0F172A;
    line-height: 1.6;
    font-weight: 500;
  }

  /* ========== Diagram Container ========== */
  .diagram {
    border: 1px solid #D0D0D0;
    padding: 18px 20px;
    background: #FAFAFA;
    margin: 8px 0;
  }
  .diagram-title {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    color: #2563EB;
    letter-spacing: 0.2em;
    font-weight: 600;
    margin-bottom: 10px;
    text-transform: uppercase;
  }
  .svg-diagram { width: 100%; height: auto; display: block; }

  /* ========== Footer ========== */
  .page-footer {
    padding: 14px 40px;
    border-top: 1px solid #D0D0D0;
    background: #fff;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    color: #999;
    letter-spacing: 0.1em;
  }
  .page-footer .left { font-weight: 500; }
  .page-footer .right { font-weight: 600; color: #555; }

  /* ========== Info Table ========== */
  .info-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    /* th の width 指定を実際に効かせる。fixed でないと長いURLやシステムIDで
       列幅が勝手に広がり、内容列が潰れる（実測: 180px → 330px）。 */
    table-layout: fixed;
  }
  .info-table td, .info-table th { overflow-wrap: anywhere; }
  .info-table th {
    background: #F5F5F4;
    color: #0F172A;
    font-weight: 600;
    padding: 8px 14px;
    text-align: left;
    border-bottom: 2px solid #2563EB;
    font-size: 11px;
    letter-spacing: 0.05em;
  }
  .info-table td {
    padding: 8px 14px;
    border-bottom: 1px solid #E5E5E5;
    line-height: 1.65;
    vertical-align: top;
  }
  .info-table tr:last-child td { border-bottom: none; }
  .info-table .row-label {
    font-weight: 600;
    color: #2563EB;
    width: 180px;
  }

  /* ========== Optional: Diff Markers (for "added on date" tags) ========== */
  .diff-new {
    color: #DC2626;
  }
  .diff-new strong { color: #DC2626; }
  .diff-tag {
    display: inline-block;
    font-family: 'Inter', sans-serif;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.08em;
    padding: 1px 6px;
    margin: 0 4px 0 2px;
    background: #FEE2E2;
    color: #DC2626;
    border: 1px solid #DC2626;
    border-radius: 2px;
    vertical-align: middle;
    line-height: 1.3;
  }
  .diff-row td {
    background: #FEF2F2 !important;
  }
  .diff-cell {
    background: #FEF2F2 !important;
  }

  /* ========== Print / PDF ==========
     ブラウザ印刷で 1スライド = 1ページ にする。
     これが無いと US Letter 縦に組まれ、スライドがページ境界で切断される
     （実測: 3スライドが2ページに詰め込まれ、MediaBox は 612×792）。
     色は既定では印刷されないので print-color-adjust で強制する
     （takeaway の #EFF6FF、カバー帯の #F5F5F4、表ヘッダなどが白く飛ぶ）。 */
  @media print {
    @page { size: 1280px 720px; margin: 0; }
    html, body { background: #fff; padding: 0; }
    .slides-container { display: block; gap: 0; }
    .slide-meta { display: none; }
    .slide {
      box-shadow: none;
      border: none;
      margin: 0;
      break-after: page;
      page-break-after: always;
    }
    .slide:last-child { break-after: auto; page-break-after: auto; }
    * {
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
  }
</style>
</head>
<body>

<div class="slides-container">

  <!-- ###### PASTE SLIDES HERE ###### -->

</div>

</body>
</html>
